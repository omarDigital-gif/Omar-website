  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0b08;
      --bg-panel: #17140e;
      --gold: #c9a565;
      --gold-bright: #e2c07f;
      --gold-dim: #8a7546;
      --ivory: #f4efe3;
      --taupe: #a89b82;
      --taupe-dim: #6f6552;
      --border: #2c2820;
      --border-soft: #211d17;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cormorant Garamond', serif;
      background: var(--bg);
      background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,165,101,0.10), transparent 60%);
      color: var(--ivory);
      min-height: 100vh;
      font-size: 19px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .display, .btn, .nav-logo, .price {
      font-family: 'Playfair Display', serif;
    }

    a { color: inherit; }

    .wrap { max-width: 860px; margin: 0 auto; padding-left: 28px; padding-right: 28px; }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,11,8,0.88);
      backdrop-filter: blur(8px);
    }

    .nav-logo-group { display: flex; align-items: center; gap: 12px; text-decoration: none; }

    .mark-mini {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--gold);
    }

    .nav-logo { font-weight: 700; font-size: 1.15rem; color: var(--ivory); }

    .nav-link {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: var(--taupe);
      text-decoration: none;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--gold-bright); }

    /* HERO */
    .hero {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 28px 40px;
      text-align: center;
    }

    .mark {
      width: 62px;
      height: 62px;
      margin: 0 auto 28px;
      border-radius: 50%;
      border: 1px solid var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-style: italic;
      font-size: 1.5rem;
      color: var(--gold);
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 2.9rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero p {
      color: var(--taupe);
      font-size: 1.25rem;
      max-width: 480px;
      margin: 0 auto 34px;
    }

    .hero-ctas {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* BUNDLE (MATCHING IMAGE) */
    .bundle-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    .section-lead-alt {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--taupe);
      margin-left: auto;
    }

    .bundle {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0d0b08;
      padding: 48px;
      position: relative;
    }

    .bundle-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
    }

    .bundle h3 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 500;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .bundle p.desc {
      color: var(--taupe);
      font-size: 1.15rem;
      max-width: 540px;
      line-height: 1.5;
    }

    .bundle-price { text-align: right; }
    .bundle-price .price { font-size: 2.4rem; color: var(--gold); }
    .bundle-price .price-was {
      font-family: 'Cormorant Garamond', serif;
      color: var(--taupe-dim);
      text-decoration: line-through;
      font-size: 1.2rem;
      margin-left: 8px;
    }

    .bundle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin: 0 -48px;
    }

    .grid-item {
      padding: 32px 48px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .grid-item:not(:last-child) { border-right: 1px solid var(--border); }

    .grid-item .check { color: var(--gold); margin-bottom: 8px; font-weight: bold; }

    .grid-item .item-name {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 1.15rem;
      color: var(--gold);
    }

    .grid-item .item-price { color: var(--taupe-dim); font-size: 1rem; }

    .bundle-footer {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bundle-note { color: var(--taupe-dim); font-size: 1rem; font-style: italic; }

    /* BUTTONS */
    .btn {
      display: inline-block;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.2s;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn-gold { background: var(--gold); color: #0d0b08; }
    .btn-gold:hover { background: var(--gold-bright); transform: translateY(-1px); }

    .btn-ghost { background: transparent; color: var(--ivory); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--gold-dim); color: var(--gold-bright); }

    /* INDIVIDUAL PRODUCTS & SECTIONS */
    section { padding: 80px 0; }
    .section-title { font-size: 1.8rem; margin-bottom: 32px; font-weight: 700; }

    .product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 0;
      border-top: 1px solid var(--border);
    }

    .product-info h3 { font-size: 1.4rem; margin-bottom: 8px; }
    .product-info p { color: var(--taupe); max-width: 480px; }

    .product-action { display: flex; align-items: center; gap: 24px; }
    .product-action .price { font-size: 1.3rem; color: var(--ivory); }

    /* STATS */
    .stats {
      display: flex;
      justify-content: center;
      gap: 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 40px 0;
      margin-bottom: 40px;
    }
    .stat { flex: 1; text-align: center; }
    .stat + .stat { border-left: 1px solid var(--border); }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); display: block; }
    .stat-label { color: var(--taupe-dim); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; }

    /* FOOTER */
    footer { text-align: center; padding: 60px 24px; color: var(--taupe-dim); border-top: 1px solid var(--border-soft); }
    footer a { color: var(--taupe); text-decoration: underline; }
    footer .sep { margin: 0 10px; opacity: 0.3; }
